<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>성과 대시보드 · G카운트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --green:#059669; --green-dark:#047857; --green-soft:#ECFDF5; --green-line:#A7F3D0;
    --amber:#F59E0B; --amber-soft:#FFFBEB;
    --blue:#3B82F6;
    --ink:#152B22; --ink-2:#4B5F56; --ink-3:#8CA096;
    --bg:#F6FAF8; --card:#FFFFFF; --line:#E4EEE9;
    --r:16px; --r-sm:10px;
    --shadow:0 1px 2px rgba(21,43,34,.05), 0 4px 14px rgba(21,43,34,.06);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5;
    padding-bottom:56px;
  }
  .wrap{max-width:960px; margin:0 auto; padding:0 16px}

  /* ── 헤더 ── */
  header{background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20}
  .head-in{display:flex; align-items:center; justify-content:space-between; padding:14px 0}
  .brand{display:flex; align-items:center; gap:10px}
  .brand .logo{width:34px; height:34px; border-radius:10px; background:var(--green); color:#fff;
    display:grid; place-items:center; font-weight:800; font-size:15px}
  .brand h1{font-size:17px; font-weight:800; letter-spacing:-.01em}
  .brand .sub{font-size:12px; color:var(--ink-3); font-weight:500}
  .updated{font-size:12px; color:var(--ink-3); text-align:right}
  .updated button{border:none; background:none; color:var(--green); font-weight:700; font-size:12px; cursor:pointer; font-family:inherit}

  /* ── 팀 탭 ── */
  .team-tabs{display:flex; gap:6px; padding:0 0 12px}
  .team-tab{flex:0 0 auto; padding:8px 16px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--ink-2); font-weight:700; font-size:14px; cursor:pointer; font-family:inherit}
  .team-tab.on{background:var(--green); border-color:var(--green); color:#fff}
  .team-tab:focus-visible{outline:2px solid var(--green-dark); outline-offset:2px}

  /* ── 기간 컨트롤 ── */
  .controls{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:18px 0 14px; flex-wrap:wrap}
  .seg{display:inline-flex; background:#E9F2EE; border-radius:12px; padding:4px}
  .seg button{border:none; background:none; padding:7px 18px; border-radius:9px; font-weight:700;
    font-size:14px; color:var(--ink-2); cursor:pointer; font-family:inherit}
  .seg button.on{background:var(--card); color:var(--green-dark); box-shadow:var(--shadow)}
  .pager{display:flex; align-items:center; gap:4px}
  .pager button{width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:var(--card);
    cursor:pointer; font-size:14px; color:var(--ink-2); font-family:inherit}
  .pager button:disabled{opacity:.35; cursor:default}
  .pager .label{min-width:150px; text-align:center; font-weight:800; font-size:15px}
  .pager .today-btn{width:auto; padding:0 12px; font-weight:700; font-size:13px; color:var(--green-dark)}

  /* ── 섹션 컨테이너: 기간별로 order만 바꿔 강조점 이동 ── */
  .sections{display:flex; flex-direction:column; gap:14px}
  .sections .card{margin-top:0}
  .mode-hint{font-size:12.5px; color:var(--ink-3); font-weight:600; margin:-6px 0 12px}
  .mode-hint b{color:var(--green-dark)}
  .delta-line{margin-top:8px; font-size:14px; font-weight:700; display:none}
  .delta-line.show{display:block}
  .delta-line .big{font-size:20px; letter-spacing:-.01em}

  /* ── KPI ── */
  .kpis-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; box-shadow:var(--shadow)}
  .kpi .k-label{font-size:12.5px; color:var(--ink-3); font-weight:600; display:flex; align-items:center; gap:6px}
  .kpi .dot{width:8px; height:8px; border-radius:50%}
  .kpi .k-val{font-size:26px; font-weight:800; letter-spacing:-.02em; margin-top:2px; font-variant-numeric:tabular-nums}
  .kpi .k-val small{font-size:14px; font-weight:600; color:var(--ink-3); margin-left:2px}
  .kpi .k-delta{font-size:12px; font-weight:700; margin-top:2px}
  .up{color:var(--green-dark)} .down{color:#DC2626} .flat{color:var(--ink-3)}

  /* ── 카드 공통 ── */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow);
    padding:18px; margin-top:14px}
  .card h2{font-size:15px; font-weight:800; display:flex; align-items:center; justify-content:space-between}
  .card h2 .hint{font-size:12px; color:var(--ink-3); font-weight:500}
  .chart-box{position:relative; height:260px; margin-top:12px}

  /* ── 담당자 테이블 ── */
  table{width:100%; border-collapse:collapse; margin-top:10px; font-variant-numeric:tabular-nums}
  th{font-size:12px; color:var(--ink-3); font-weight:700; text-align:right; padding:8px 10px; border-bottom:1px solid var(--line)}
  th:first-child, td:first-child{text-align:left}
  td{padding:11px 10px; border-bottom:1px solid var(--line); font-size:14.5px; text-align:right}
  tr:last-child td{border-bottom:none}
  td .name{font-weight:700}
  td .rank{display:inline-grid; place-items:center; width:20px; height:20px; border-radius:6px;
    background:var(--green-soft); color:var(--green-dark); font-size:11.5px; font-weight:800; margin-right:8px}
  tr.total td{background:#FAFCFB; font-weight:800; border-top:2px solid var(--line)}
  .conv{font-size:12px; color:var(--ink-3)}

  /* ── 목표 게이지 (일간 전용 시그니처) ── */
  .pace{margin-top:6px}
  .pace-row{display:grid; grid-template-columns:64px 1fr 74px; gap:12px; align-items:center; padding:9px 0}
  .pace-row + .pace-row{border-top:1px dashed var(--line)}
  .pace-name{font-weight:700; font-size:14px}
  .bar{height:12px; background:#EDF4F1; border-radius:999px; overflow:hidden; position:relative}
  .bar > i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#34D399,var(--green));
    transition:width .5s ease}
  .bar > i.over{background:linear-gradient(90deg,var(--green),#0B7A5C)}
  .pace-num{font-size:13px; font-weight:700; color:var(--ink-2); text-align:right; white-space:nowrap}
  .pace-num b{color:var(--green-dark)}
  .badge-done{font-size:11px; font-weight:800; color:var(--green-dark); background:var(--green-soft);
    border-radius:6px; padding:1px 6px; margin-left:4px}

  /* ── 빈 상태 / 안내 ── */
  .empty{padding:44px 20px; text-align:center; color:var(--ink-2)}
  .empty .emoji{font-size:34px}
  .empty h3{font-size:16px; font-weight:800; margin:10px 0 4px; color:var(--ink)}
  .empty p{font-size:13.5px; color:var(--ink-3); max-width:420px; margin:0 auto}
  .banner{margin-top:14px; background:var(--amber-soft); border:1px solid #FDE68A; border-radius:var(--r-sm);
    padding:10px 14px; font-size:13px; color:#92400E; display:none}
  .banner.show{display:block}
  .banner code{background:#FFF; border-radius:5px; padding:1px 5px; font-size:12px}

  @media (max-width:680px){
    .kpis-grid{grid-template-columns:repeat(2,1fr)}
    .pager .label{min-width:118px; font-size:14px}
    .chart-box{height:220px}
    th:nth-child(5), td:nth-child(5){display:none} /* 좁은 화면에선 전환율 숨김 */
  }
  @media (prefers-reduced-motion:reduce){ .bar > i{transition:none} }

  /* ── 로그인 오버레이 ── */
  .login-overlay{position:fixed; inset:0; background:var(--bg); z-index:100; display:grid; place-items:center; padding:20px}
  .login-card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow);
    padding:28px 24px; width:100%; max-width:340px; text-align:center}
  .login-card .logo{width:44px; height:44px; border-radius:12px; background:var(--green); color:#fff;
    display:grid; place-items:center; font-weight:800; font-size:20px; margin:0 auto 14px}
  .login-card h2{font-size:18px; font-weight:800; margin-bottom:4px}
  .login-card p{font-size:13px; color:var(--ink-3); margin-bottom:18px}
  .login-card input{width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:var(--r-sm);
    font-size:15px; font-family:inherit; margin-bottom:10px; background:#fff; color:var(--ink)}
  .login-card input:focus{outline:2px solid var(--green); outline-offset:1px; border-color:var(--green)}
  .login-card button{width:100%; padding:12px; border:none; border-radius:var(--r-sm); background:var(--green);
    color:#fff; font-weight:700; font-size:15px; cursor:pointer; font-family:inherit; margin-top:4px}
  .login-card button:disabled{opacity:.6; cursor:default}
  .login-err{color:#DC2626; font-size:13px; font-weight:600; min-height:18px; margin-top:10px}
  .logout-btn{border:1px solid var(--line); background:var(--card); color:var(--ink-2); font-weight:700;
    font-size:12px; padding:6px 12px; border-radius:8px; cursor:pointer; font-family:inherit; white-space:nowrap}
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <form class="login-card" id="loginForm">
    <div class="logo">G</div>
    <h2>성과 대시보드</h2>
    <p>허용된 계정만 볼 수 있어요</p>
    <input type="text" id="loginEmail" placeholder="아이디" autocomplete="username" required />
    <input type="password" id="loginPw" placeholder="비밀번호" autocomplete="current-password" required />
    <button type="submit" id="loginBtn">로그인</button>
    <div class="login-err" id="loginErr"></div>
  </form>
</div>

<header>
  <div class="wrap">
    <div class="head-in">
      <div class="brand">
        <div class="logo">G</div>
        <div>
          <h1>성과 대시보드</h1>
          <div class="sub">기린이가 매일 집계해요 🧡</div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:10px">
        <div class="updated" id="updated"></div>
        <button id="logoutBtn" class="logout-btn" style="display:none">로그아웃</button>
      </div>
    </div>
    <nav class="team-tabs" id="teamTabs" aria-label="팀 선택"></nav>
  </div>
</header>

<main class="wrap" id="main">
  <div class="banner" id="demoBanner">
    지금은 <b>데모 데이터</b>로 보고 있어요. <code>dashboard.html</code> 상단의 <code>API_URL</code>에
    Apps Script 배포 주소를 넣으면 실제 시트 데이터로 바뀝니다.
  </div>

  <div class="controls">
    <div class="seg" id="periodSeg" role="tablist" aria-label="집계 단위">
      <button data-p="day" role="tab">일간</button>
      <button data-p="week" role="tab">주간</button>
      <button data-p="month" role="tab">월간</button>
    </div>
    <div class="pager">
      <button id="prevBtn" aria-label="이전 기간">◀</button>
      <div class="label" id="periodLabel">—</div>
      <button id="nextBtn" aria-label="다음 기간">▶</button>
      <button class="today-btn" id="todayBtn">오늘</button>
    </div>
  </div>

  <div class="mode-hint" id="modeHint"></div>

  <div class="sections" id="sections">
    <section class="kpis" id="kpiSec"><div class="kpis-grid" id="kpis"></div></section>

    <section class="card" id="chartSec">
      <h2><span id="chartTitle">추이</span> <span class="hint" id="chartHint"></span></h2>
      <div class="delta-line" id="chartDelta"></div>
      <div class="chart-box"><canvas id="trend"></canvas></div>
    </section>

    <section class="card" id="paceCard">
      <h2>오늘의 페이스 <span class="hint">일일 목표 컨텍 <b id="goalNum">50</b>명</span></h2>
      <div class="pace" id="pace"></div>
    </section>

    <section class="card" id="tableSec">
      <h2><span id="tableTitle">담당자별 성과</span> <span class="hint" id="tableHint"></span></h2>
      <div id="personTable"></div>
    </section>
  </div>
</main>

<script>
/* ════════════════════════════════════════════════════
   설정 — 팀별로 Apps Script 배포 URL을 넣어주세요.
   비워두면 데모 데이터로 동작합니다.
   ════════════════════════════════════════════════════ */
/* Supabase 연결 정보 */
const SUPABASE_URL = 'https://azjgoateatcjnlholies.supabase.co';
const SUPABASE_KEY = 'sb_publishable_6GAND6L5YdhOroKzixthEg_7Ad7efx5';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TEAMS = [
  { id: 'infl',   name: '인플팀'   },
  { id: 'media',  name: '미디어팀' },
  { id: 'growth', name: '그로스팀' },
];
const DAILY_CONTACT_GOAL = 70; // 인플팀 일일 컨텍 목표

/* ── 상태 ── */
const state = { team: TEAMS[0], period: 'day', cursor: null, data: {}, chart: null };

/* ── 유틸: 날짜 키 ── */
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function weekStart(dateStr){ // 월요일 시작
  const d = new Date(dateStr + 'T00:00:00');
  const off = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - off);
  return fmtDate(d);
}
function periodKey(dateStr, p){
  if (p === 'day') return dateStr;
  if (p === 'week') return weekStart(dateStr);
  return dateStr.slice(0, 7); // YYYY-MM
}
function periodLabel(key, p){
  if (p === 'day'){
    const d = new Date(key + 'T00:00:00');
    return `${d.getMonth()+1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`;
  }
  if (p === 'week'){
    const s = new Date(key + 'T00:00:00'), e = new Date(s); e.setDate(e.getDate()+6);
    return `${s.getMonth()+1}/${s.getDate()} ~ ${e.getMonth()+1}/${e.getDate()}`;
  }
  return `${+key.slice(0,4)}년 ${+key.slice(5,7)}월`;
}
function shortLabel(key, p){
  if (p === 'day') return `${+key.slice(5,7)}/${+key.slice(8,10)}`;
  if (p === 'week') return `${+key.slice(5,7)}/${+key.slice(8,10)}주`;
  return `${+key.slice(5,7)}월`;
}

/* ── 집계 ── */
function aggregate(daily, p){
  const map = new Map(); // key → { total:{c,r,u}, persons: Map }
  for (const row of daily){
    const k = periodKey(row.date, p);
    if (!map.has(k)) map.set(k, { total:{c:0,r:0,u:0}, persons:new Map() });
    const g = map.get(k);
    g.total.c += row.contact; g.total.r += row.reserve; g.total.u += row.upload;
    if (!g.persons.has(row.person)) g.persons.set(row.person, {c:0,r:0,u:0});
    const pp = g.persons.get(row.person);
    pp.c += row.contact; pp.r += row.reserve; pp.u += row.upload;
  }
  return map;
}
const sortedKeys = map => [...map.keys()].sort();

/* ── 데모 데이터 (API_URL 미설정 시) ── */
function demoData(teamName){
  const persons = teamName === '인플팀'
    ? ['김수아','윤예지','지성경','윤설아']
    : teamName === '미디어팀' ? ['박도윤','이서준','최하람'] : ['정민재','한유주'];
  const daily = [];
  const start = new Date('2026-04-20T00:00:00'), end = new Date('2026-07-06T00:00:00');
  let seed = teamName.length * 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
    const dow = d.getDay();
    persons.forEach((person, i) => {
      const base = 45 + i * 8;
      const c = (dow === 0) ? Math.round(rnd()*10) : Math.max(0, Math.round(base + (rnd()-0.5)*30));
      const r = rnd() > 0.86 ? 1 : 0;
      const u = rnd() > 0.8 ? Math.round(rnd()*2) : 0;
      if (c || r || u) daily.push({ date: fmtDate(d), person, contact: c, reserve: r, upload: u });
    });
  }
  return { team: teamName, updatedAt: new Date().toISOString(), daily, demo: true };
}

/* ── 데이터 로드 (Supabase) ── */
async function loadTeam(team){
  if (state.data[team.id]) return state.data[team.id];
  let payload;
  try {
    const { data, error } = await sb
      .from('daily_stats')
      .select('date, person, contact, reserve, upload')
      .eq('team', team.id)
      .order('date', { ascending: true });
    if (error) throw error;
    payload = { team: team.name, updatedAt: new Date().toISOString(), daily: data || [], demo: false };
  } catch (err){
    console.error('Supabase 데이터 로드 실패:', err);
    payload = { team: team.name, updatedAt: new Date().toISOString(), daily: [], demo: false, error: true };
  }
  state.data[team.id] = payload;
  return payload;
}

/* ── 렌더 ── */
async function render(){
  const payload = await loadTeam(state.team);
  document.getElementById('demoBanner').classList.toggle('show', !!payload.demo);
  document.getElementById('updated').innerHTML = payload.demo
    ? '데모 모드'
    : `업데이트 ${payload.updatedAt.replace('T',' ').slice(0,16)} · <button onclick="refresh()">새로고침</button>`;

  const p = state.period;
  const agg = aggregate(payload.daily, p);
  const keys = sortedKeys(agg);
  if (!keys.length){ renderEmpty(); return; }

  // 커서 보정 (기간 전환·팀 전환 시 최신으로)
  if (!state.cursor || !keys.includes(state.cursor)) state.cursor = keys[keys.length-1];
  const idx = keys.indexOf(state.cursor);
  const cur = agg.get(state.cursor);
  const prev = idx > 0 ? agg.get(keys[idx-1]) : null;

  // 기간 라벨 & 페이저
  document.getElementById('periodLabel').textContent = periodLabel(state.cursor, p);
  document.getElementById('prevBtn').disabled = idx <= 0;
  document.getElementById('nextBtn').disabled = idx >= keys.length-1;

  applyLayout(p);
  renderKpis(cur, prev, p);
  renderChart(agg, keys, p);
  renderDelta(cur, prev, p);
  renderPace(payload, agg);
  renderTable(cur, p);
}

/* 기간별 화면 성격: 일간=개인 실행 관리 / 주간=팀 회고 / 월간=팀 성과 정산
   → 섹션 순서(order)와 강조만 바꾸고, 데이터는 세 뷰 모두 팀+개인 유지 */
const LAYOUTS = {
  day:   { hint:'<b>오늘 실행 관리</b> · 개인 페이스 중심 — 팀 합계는 아래 카드에서',
           order:{ paceCard:1, tableSec:2, kpiSec:3, chartSec:4 },
           chartTitle:'팀 추이', tableTitle:'담당자별 성과' },
  week:  { hint:'<b>주간 회고</b> · 팀 추이 중심 — 개인별 주간 합계는 하단에',
           order:{ kpiSec:1, chartSec:2, tableSec:3, paceCard:4 },
           chartTitle:'팀 주간 추이', tableTitle:'개인별 주간 합계' },
  month: { hint:'<b>성과 정산</b> · 팀 합산 중심 — 개인별 월 누적은 하단에',
           order:{ kpiSec:1, chartSec:2, tableSec:3, paceCard:4 },
           chartTitle:'팀 월간 추이', tableTitle:'개인별 월 누적' },
};
function applyLayout(p){
  const L = LAYOUTS[p];
  document.getElementById('modeHint').innerHTML = L.hint;
  for (const [id, ord] of Object.entries(L.order)){
    document.getElementById(id).style.order = ord;
  }
  // 페이스 게이지는 일간(인플팀)에서만 — 주간/월간은 팀 뷰라 숨김
  document.getElementById('paceCard').style.display =
    (p === 'day' && state.team.id === 'infl') ? '' : 'none';
  document.getElementById('chartTitle').textContent = L.chartTitle;
  document.getElementById('tableTitle').textContent = L.tableTitle;
}

/* 주간/월간: 팀 합산 증감 헤드라인 (전주/전월 대비) */
function renderDelta(cur, prev, p){
  const el = document.getElementById('chartDelta');
  if (p === 'day' || !prev){ el.classList.remove('show'); el.innerHTML = ''; return; }
  const label = p === 'week' ? '전주 대비' : '전월 대비';
  const d = cur.total.c - prev.total.c;
  const cls = d > 0 ? 'up' : d < 0 ? 'down' : 'flat';
  const arrow = d > 0 ? '▲' : d < 0 ? '▼' : '—';
  el.innerHTML = `${label} 컨텍 <span class="big ${cls}">${arrow} ${Math.abs(d).toLocaleString()}건</span>
    <span style="color:var(--ink-3);font-weight:600;font-size:12.5px"> (${prev.total.c.toLocaleString()} → ${cur.total.c.toLocaleString()})</span>`;
  el.classList.add('show');
}

function deltaHtml(now, before){
  if (before == null) return '<span class="flat">— 이전 기간 없음</span>';
  const d = now - before;
  if (d === 0) return '<span class="flat">이전과 동일</span>';
  return d > 0
    ? `<span class="up">▲ ${d.toLocaleString()} 늘었어요</span>`
    : `<span class="down">▼ ${Math.abs(d).toLocaleString()} 줄었어요</span>`;
}

function renderKpis(cur, prev, p){
  const conv = cur.total.c ? (cur.total.r / cur.total.c * 100) : 0;
  const prevConv = prev && prev.total.c ? (prev.total.r / prev.total.c * 100) : null;
  const items = [
    { label:'컨텍',   color:'var(--green)', val:cur.total.c, unit:'건', delta:deltaHtml(cur.total.c, prev?.total.c) },
    { label:'예약',   color:'var(--blue)',  val:cur.total.r, unit:'건', delta:deltaHtml(cur.total.r, prev?.total.r) },
    { label:'업로드', color:'var(--amber)', val:cur.total.u, unit:'건', delta:deltaHtml(cur.total.u, prev?.total.u) },
    { label:'예약 전환율', color:'#94A3B8', val:conv.toFixed(1), unit:'%',
      delta: prevConv == null ? '<span class="flat">— 이전 기간 없음</span>'
        : deltaHtml(+conv.toFixed(1), +prevConv.toFixed(1)).replace(/늘었어요|줄었어요/, 'p') },
  ];
  document.getElementById('kpis').innerHTML = items.map(it => `
    <div class="kpi">
      <div class="k-label"><span class="dot" style="background:${it.color}"></span>${it.label}</div>
      <div class="k-val">${(+it.val).toLocaleString()}<small>${it.unit}</small></div>
      <div class="k-delta">${it.delta}</div>
    </div>`).join('');
}

function renderChart(agg, keys, p){
  const n = p === 'day' ? 14 : p === 'week' ? 12 : 12;
  const shown = keys.slice(-n);
  document.getElementById('chartHint').textContent =
    p === 'day' ? '최근 14일' : p === 'week' ? '최근 12주' : '최근 12개월';

  const labels = shown.map(k => shortLabel(k, p));
  const contacts = shown.map(k => agg.get(k).total.c);
  const reserves = shown.map(k => agg.get(k).total.r);
  const uploads  = shown.map(k => agg.get(k).total.u);
  const hi = shown.indexOf(state.cursor);

  if (state.chart) state.chart.destroy();
  state.chart = new Chart(document.getElementById('trend'), {
    data: {
      labels,
      datasets: [
        { type:'bar', label:'컨텍', data:contacts, borderRadius:6,
          backgroundColor: contacts.map((_,i)=> i===hi ? '#047857' : '#34D39988'), yAxisID:'y' },
        { type:'line', label:'업로드', data:uploads, borderColor:'#F59E0B', backgroundColor:'#F59E0B',
          tension:.35, pointRadius:3, yAxisID:'y1' },
        { type:'line', label:'예약', data:reserves, borderColor:'#3B82F6', backgroundColor:'#3B82F6',
          borderDash:[5,4], tension:.35, pointRadius:3, yAxisID:'y1' },
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{ legend:{ labels:{ usePointStyle:true, boxWidth:8, font:{ family:'Pretendard Variable' } } } },
      scales:{
        x:{ grid:{ display:false } },
        y:{ beginAtZero:true, grid:{ color:'#EDF4F1' }, title:{ display:true, text:'컨텍' } },
        y1:{ beginAtZero:true, position:'right', grid:{ drawOnChartArea:false }, title:{ display:true, text:'업로드·예약' } },
      },
      onClick(_, els){ if (els.length){ state.cursor = shown[els[0].index]; render(); } },
    }
  });
}

/* 오늘의 페이스: 항상 "오늘" 기준 담당자별 목표 게이지 */
function renderPace(payload, _agg){
  const card = document.getElementById('paceCard');
  if (state.team.id !== 'infl' || state.period !== 'day'){ card.style.display = 'none'; return; }
  card.style.display = '';
  document.getElementById('goalNum').textContent = DAILY_CONTACT_GOAL;

  const dayAgg = aggregate(payload.daily, 'day');
  const dayKeys = sortedKeys(dayAgg);
  const todayKey = state.cursor || dayKeys[dayKeys.length-1];
  const persons = [...new Set(payload.daily.map(r => r.person))];
  const today = dayAgg.get(todayKey) || { persons: new Map() };

  document.querySelector('#paceCard h2').firstChild.textContent =
    `${periodLabel(todayKey,'day')} 페이스 `;

  document.getElementById('pace').innerHTML = persons.map(name => {
    const v = today.persons.get(name)?.c ?? 0;
    const pct = Math.min(100, v / DAILY_CONTACT_GOAL * 100);
    const done = v >= DAILY_CONTACT_GOAL;
    return `
      <div class="pace-row">
        <div class="pace-name">${name}</div>
        <div class="bar" role="progressbar" aria-valuenow="${v}" aria-valuemax="${DAILY_CONTACT_GOAL}" aria-label="${name} 컨텍">
          <i class="${done?'over':''}" style="width:${pct}%"></i>
        </div>
        <div class="pace-num"><b>${v}</b>/${DAILY_CONTACT_GOAL}${done?'<span class="badge-done">달성</span>':''}</div>
      </div>`;
  }).join('');
}

function renderTable(cur, p){
  document.getElementById('tableHint').textContent = periodLabel(state.cursor, p) + ' 기준';
  const rows = [...cur.persons.entries()]
    .map(([name, v]) => ({ name, ...v, conv: v.c ? v.r / v.c * 100 : 0 }))
    .sort((a, b) => b.c - a.c);
  const t = cur.total;
  document.getElementById('personTable').innerHTML = `
    <table>
      <thead><tr><th>담당자</th><th>컨텍</th><th>예약</th><th>업로드</th><th>전환율</th></tr></thead>
      <tbody>
        ${rows.map((r, i) => `
          <tr>
            <td><span class="rank">${i+1}</span><span class="name">${r.name}</span></td>
            <td>${r.c.toLocaleString()}</td>
            <td>${r.r.toLocaleString()}</td>
            <td>${r.u.toLocaleString()}</td>
            <td class="conv">${r.conv.toFixed(1)}%</td>
          </tr>`).join('')}
        <tr class="total">
          <td>합계</td><td>${t.c.toLocaleString()}</td><td>${t.r.toLocaleString()}</td>
          <td>${t.u.toLocaleString()}</td>
          <td class="conv">${(t.c ? t.r/t.c*100 : 0).toFixed(1)}%</td>
        </tr>
      </tbody>
    </table>`;
}

function renderEmpty(){
  document.getElementById('kpis').innerHTML = '';
  document.getElementById('personTable').innerHTML = `
    <div class="empty">
      <div class="emoji">🦒</div>
      <h3>아직 데이터가 없어요</h3>
      <p>이 팀의 시트를 Apps Script로 연결하면, 인플팀과 똑같은 화면이 자동으로 생성돼요.
      상단 <b>TEAMS</b> 설정에 배포 URL만 넣어주세요.</p>
    </div>`;
  if (state.chart){ state.chart.destroy(); state.chart = null; }
}

/* ── 인터랙션 ── */
function refresh(){ delete state.data[state.team.id]; render(); }
function setPeriod(p){
  state.period = p; state.cursor = null;
  document.querySelectorAll('#periodSeg button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  render();
}
function move(dir){
  const agg = aggregate(state.data[state.team.id].daily, state.period);
  const keys = sortedKeys(agg);
  const idx = keys.indexOf(state.cursor) + dir;
  if (idx >= 0 && idx < keys.length){ state.cursor = keys[idx]; render(); }
}

document.getElementById('teamTabs').innerHTML = TEAMS.map(t =>
  `<button class="team-tab" data-id="${t.id}">${t.name}</button>`).join('');
document.querySelectorAll('.team-tab').forEach(btn => btn.addEventListener('click', () => {
  state.team = TEAMS.find(t => t.id === btn.dataset.id);
  state.cursor = null;
  document.querySelectorAll('.team-tab').forEach(b => b.classList.toggle('on', b === btn));
  render();
}));
document.querySelector('.team-tab').classList.add('on');
document.getElementById('prevBtn').addEventListener('click', () => move(-1));
document.getElementById('nextBtn').addEventListener('click', () => move(1));
document.getElementById('todayBtn').addEventListener('click', () => { state.cursor = null; render(); });
document.querySelectorAll('#periodSeg button').forEach(b => b.addEventListener('click', () => setPeriod(b.dataset.p)));

/* ── 로그인(Auth) ── */
let appStarted = false;
function showLogin(){ document.getElementById('loginOverlay').style.display = 'grid'; }
function hideLogin(){ document.getElementById('loginOverlay').style.display = 'none'; }
function startApp(){
  if (appStarted) return;
  appStarted = true;
  document.getElementById('logoutBtn').style.display = '';
  setPeriod('day');
  // 5분마다 자동으로 최신 데이터 다시 불러오기
  setInterval(() => { state.data = {}; render(); }, 5 * 60 * 1000);
}
async function initAuth(){
  const { data:{ session } } = await sb.auth.getSession();
  if (session){ hideLogin(); startApp(); } else { showLogin(); }
}
async function doLogin(e){
  e.preventDefault();
  let email = document.getElementById('loginEmail').value.trim();
  if (email && !email.includes('@')) email += '@team.co';  // 아이디만 입력하면 도메인 자동 추가
  const pw = document.getElementById('loginPw').value;
  const errEl = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  errEl.textContent = '';
  btn.disabled = true; btn.textContent = '로그인 중…';
  const { error } = await sb.auth.signInWithPassword({ email, password: pw });
  btn.disabled = false; btn.textContent = '로그인';
  if (error){ errEl.textContent = '이메일 또는 비밀번호가 올바르지 않아요.'; return; }
  hideLogin(); startApp();
}
document.getElementById('loginForm').addEventListener('submit', doLogin);
document.getElementById('logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

initAuth();
</script>
